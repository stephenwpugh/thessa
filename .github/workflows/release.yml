name: Release

on:
  push:
    tags: ["v*", "web-v*", "desktop-v*"]
  pull_request:
    branches: [main]
    types: [closed]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release/'))
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      component: ${{ steps.release.outputs.component }}
      build_desktop: ${{ steps.release.outputs.build_desktop }}
    steps:
      - id: release
        env:
          RELEASE_TAG: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.event.inputs.tag || github.ref_name }}
        run: |
          RELEASE_TAG="${RELEASE_TAG#release/}"
          case "$RELEASE_TAG" in
            web-v*) component=web; build_desktop=false ;;
            desktop-v*) component=desktop; build_desktop=true ;;
            v*) component=paired; build_desktop=true ;;
            *) echo "Unsupported tag: $RELEASE_TAG" >&2; exit 1 ;;
          esac
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "component=$component" >> "$GITHUB_OUTPUT"
          echo "build_desktop=$build_desktop" >> "$GITHUB_OUTPUT"

  tag:
    needs: prepare
    if: github.event_name == 'pull_request' && needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
      - name: Create the immutable release tag
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          git fetch --tags origin
          existing="$(git rev-list -n 1 "$RELEASE_TAG" 2>/dev/null || true)"
          if [ -n "$existing" ]; then
            if [ "$existing" != "$MERGE_SHA" ]; then
              echo "Refusing to reuse $RELEASE_TAG for a different commit." >&2
              exit 1
            fi
            echo "$RELEASE_TAG already points at this merge commit."
            exit 0
          fi
          git tag --annotate "$RELEASE_TAG" "$MERGE_SHA" --message "Release $RELEASE_TAG"
          git push origin "$RELEASE_TAG"

  validate:
    needs: [prepare, tag]
    if: always() && needs.prepare.result == 'success' && (needs.tag.result == 'success' || needs.tag.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm release:check ${{ needs.prepare.outputs.tag }}
      - run: pnpm --filter @thessa/diagram-core typecheck
      - run: pnpm --filter @thessa/web typecheck
      - run: pnpm build

  desktop-dmg:
    needs: [prepare, validate]
    if: always() && needs.prepare.result == 'success' && needs.validate.result == 'success' && needs.prepare.outputs.build_desktop == 'true'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - run: pnpm install --frozen-lockfile
      - name: Build Apple Silicon app
        run: pnpm --filter @thessa/desktop exec tauri build --bundles app --target aarch64-apple-darwin
      - name: Package Apple Silicon DMG
        run: |
          app_path=apps/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Thessa.app
          dmg_path=release-assets/Thessa_${{ needs.prepare.outputs.tag }}_aarch64.dmg
          mkdir -p release-assets
          hdiutil create -volname Thessa -srcfolder "$app_path" -ov -format UDZO "$dmg_path"
      - name: Generate checksums
        run: |
          cd release-assets
          shasum -a 256 *.dmg > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-dmg-${{ needs.prepare.outputs.tag }}
          path: release-assets/
          if-no-files-found: error

  publish:
    needs: [prepare, validate, desktop-dmg]
    if: always() && needs.prepare.result == 'success' && needs.validate.result == 'success' && (needs.prepare.outputs.build_desktop == 'false' || needs.desktop-dmg.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Download desktop assets
        if: needs.prepare.outputs.build_desktop == 'true'
        uses: actions/download-artifact@v4
        with:
          name: desktop-dmg-${{ needs.prepare.outputs.tag }}
          path: release-assets
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          generate_release_notes: true
          files: release-assets/*
