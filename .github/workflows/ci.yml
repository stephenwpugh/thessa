name: CI

on:
  push:
    branches: [main, "feat/**", "fix/**", "release/**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @thessa/diagram-core typecheck
      - run: pnpm --filter @thessa/web typecheck
      - run: pnpm build
      - run: pnpm release:check

  desktop:
    name: desktop-check
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @thessa/desktop tauri:check
      - name: Build Apple Silicon app
        run: pnpm --filter @thessa/desktop exec tauri build --bundles app --target aarch64-apple-darwin
      - name: Package and verify DMG
        run: |
          scripts/package-macos-dmg.sh apps/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Thessa.app ci-assets/Thessa_aarch64.dmg
          cd ci-assets
          shasum -a 256 *.dmg > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: thessa-macos-arm64-${{ github.sha }}
          path: ci-assets/
          if-no-files-found: error
